name: Build [apache-pulsar]

on:
  push:
    paths:
      - 'apache-pulsar/**'
      - '.github/workflows/apache-pulsar-workflow.yml'
      - 'scripts/run-example-test.py'
  pull_request:
    paths:
      - 'apache-pulsar/**'
      - '.github/workflows/apache-pulsar-workflow.yml'
      - 'scripts/run-example-test.py'
      - '.env'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache local Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('apache-pulsar/**/pom.xml', 'pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install pyyaml requests

      - name: Run apache-pulsar test
        run: python scripts/run-example-test.py apache-pulsar

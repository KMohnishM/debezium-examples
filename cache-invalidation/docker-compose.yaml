services:
  postgres:
    image: quay.io/debezium/example-postgres:${DEBEZIUM_VERSION}
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=postgresuser
      - POSTGRES_PASSWORD=postgrespw
      - POSTGRES_DB=inventory
    healthcheck:
      test: "pg_isready -U postgresuser -d inventory"
      interval: 2s
      timeout: 20s
      retries: 10

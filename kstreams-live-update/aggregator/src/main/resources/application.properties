orders.topic=dbserver1.inventory.orders
categories.topic=dbserver1.inventory.categories

quarkus.http.port=${PORT:8079}
quarkus.kafka-streams.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
quarkus.kafka-streams.application-id=order-aggregator-ws
quarkus.kafka-streams.topics=${orders.topic},${categories.topic}

# streams options
kafka-streams.statestore.cache.max.bytes=10240
kafka-streams.commit.interval.ms=1000
kafka-streams.metadata.max.age.ms=500
kafka-streams.auto.offset.reset=earliest
kafka-streams.processing.guarantee=exactly_once_v2

quarkus.log.console.enable=true
quarkus.log.console.level=INFO
